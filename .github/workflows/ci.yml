name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Pack smoke test
        run: |
          pnpm pack --pack-destination .artifacts
          TARBALL="$(ls .artifacts/dsh-ds-kanban-*.tgz | head -1)"
          tar -tzf "$TARBALL" | grep -E "package/lib/(index.js|client.js)|package/cordis.patch.yml"
      - uses: actions/upload-artifact@v4
        with:
          name: pack-tarball
          path: .artifacts/dsh-ds-kanban-*.tgz
          if-no-files-found: error
